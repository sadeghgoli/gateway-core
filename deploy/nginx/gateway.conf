# HTTP → Go gateway-core (AlmaLinux + Nginx)
# گواهی را با certbot تنظیم کنید. اگر wildcard دارید همین یک server کافی است.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream gateway_core {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name map-gateway.sabzevar.ir
                apisrv-gatewaylogin.sabzevar.ir
                gateway-admin.sabzevar.ir
                apisrv-gateway137.sabzevar.ir;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name map-gateway.sabzevar.ir
                apisrv-gatewaylogin.sabzevar.ir
                gateway-admin.sabzevar.ir
                apisrv-gateway137.sabzevar.ir;

    # ssl_certificate     /etc/letsencrypt/live/sabzevar.ir/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/sabzevar.ir/privkey.pem;
    ssl_certificate     /etc/pki/nginx/fullchain.pem;
    ssl_certificate_key /etc/pki/nginx/privkey.pem;

    client_max_body_size 20m;

    location / {
        proxy_pass http://gateway_core;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }
}
